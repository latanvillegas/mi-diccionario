name: Build & Release Dictionary

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Print execution context
        run: |
          echo "=== GITHUB ACTIONS RUNNER CONTEXT ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Run Attempt: ${{ github.run_attempt }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Grant execute permission for scripts
        run: |
          chmod +x scripts/merge_and_build_es.sh
          chmod +x scripts/merge_and_build_es.py

      - name: Run dictionary merge and build pipeline
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/merge_and_build_es.sh

      - name: Verify single dictionary build outputs
        run: |
          echo "Verificando integridad del único diccionario final generado..."
          for file in "main_es.dict" "main_es.combined" "build.log" "merge_report.md"; do
            if [ ! -s "$file" ]; then
              echo "❌ Error crítico: El archivo $file no existe o está vacío. Abortando pipeline."
              exit 1
            fi
            echo "✔ $file generado correctamente ($(ls -lh "$file" | awk '{print $5}'))"
          done

      - name: Append execution metadata to build.log
        if: always()
        run: |
          echo "" >> build.log
          echo "=== GITHUB ACTIONS TRACEABILITY ===" >> build.log
          echo "RUN_ID=${{ github.run_id }}" >> build.log
          echo "RUN_NUMBER=${{ github.run_number }}" >> build.log
          echo "RUN_ATTEMPT=${{ github.run_attempt }}" >> build.log
          echo "COMMIT_SHA=${{ github.sha }}" >> build.log
          echo "REF_NAME=${{ github.ref_name }}" >> build.log
          echo "RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> build.log

      - name: Publish build report summary
        if: always() && hashFiles('merge_report.md') != ''
        run: |
          cat merge_report.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Resumen de Trazabilidad CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** \`#${{ github.run_number }}\` (Intento: \`${{ github.run_attempt }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run URL:** [${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: |
            main_es.dict
            main_es.combined
            build.log
            merge_report.md
          if-no-files-found: error
          retention-days: 90

      - name: Create and Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Dictionary Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body_path: merge_report.md
          files: |
            main_es.dict
            main_es.combined
            merge_report.md
            build.log
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
